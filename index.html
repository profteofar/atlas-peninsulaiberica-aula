<!--
  ATLAS DA PENÍNSULA IBÉRICA — HGP 5.º/6.º ano · Ficha de Avaliação n.º 1 (Grupos I e II)
  Imagens referidas localmente (colocar na mesma pasta deste ficheiro):
  Nível C: imagem1c globo · 2c planisfério · 3c linhas imaginárias (legendadas) · 4c Europa/Portugal · 5c planície · 6c montanha · 7c zonas climáticas · 8c rios
  Nível B: imagem1b globo · 2b fotografia aérea · 3b imagem de satélite · 4b planisfério · 5b linhas (A–D, 1–4) · 6b Europa (rosa-dos-ventos) · 7b relevo · 8b climas · 9b zonas (caixas) · 10b rios · 11b Ibéria Húmida/Seca
  Nível A: imagem1a planisfério · 2a imagem de satélite · 3a fotografia aérea · 4a globo · 5a linhas · 6a Europa · 7a relevo · 8a climas · 9a zonas · 10a rios · 11a Ibéria Húmida/Seca
  Para usar outros ficheiros, altere apenas o objeto IMG no início do script.
-->
<style>
/* Layout: atlas escolar — faixa de topo azul-mar, percurso em "curvas de nível" (C planície → B planalto → A montanha), cartões de exercício como folhas de atlas */
:root{
  --sea:#e4eff3; --paper:#fbfdfd; --paper2:#f1f7f9; --ink:#16374b; --muted:#557282; --line:#c6dae2;
  --accent:#16679a; --accent-ink:#ffffff; --land:#e3ae4f; --land-soft:#f6e3bb;
  --lvC:#9fbf6a; --lvB:#d39a4a; --lvA:#8b5a2b; --ok:#2c7a4f; --ok-soft:#dff1e6; --bad:#b8402f; --bad-soft:#f8e2dd; --warn-soft:#fbefd2;
  --f-display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Lexend", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "Consolas", monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sea:#0c1b24; --paper:#12283a; --paper2:#173246; --ink:#e2edf2; --muted:#9db6c3; --line:#28465a;
  --accent:#5db2e3; --accent-ink:#06202f; --land:#e0ab4e; --land-soft:#3a3020;
  --lvC:#9fc06a; --lvB:#dba256; --lvA:#c08a55; --ok:#6fcf97; --ok-soft:#173a2a; --bad:#f08a78; --bad-soft:#3e2120; --warn-soft:#3a3120; color-scheme:dark}}
:root[data-theme="dark"]{
  --sea:#0c1b24; --paper:#12283a; --paper2:#173246; --ink:#e2edf2; --muted:#9db6c3; --line:#28465a;
  --accent:#5db2e3; --accent-ink:#06202f; --land:#e0ab4e; --land-soft:#3a3020;
  --lvC:#9fc06a; --lvB:#dba256; --lvA:#c08a55; --ok:#6fcf97; --ok-soft:#173a2a; --bad:#f08a78; --bad-soft:#3e2120; --warn-soft:#3a3120; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--sea);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;font-weight:400}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(1.7rem,4vw,2.5rem);font-weight:800}
h2{font-size:clamp(1.35rem,3vw,1.8rem);font-weight:800}
h3{font-size:1.2rem;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--land);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.04em;text-transform:uppercase}

/* topo */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.1rem;line-height:1.1}
.brand small{display:block;color:var(--muted);font-size:.75rem}
nav.tabs{display:flex;gap:4px;overflow-x:auto;max-width:100%}
nav.tabs button{border:0;background:none;padding:8px 12px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
nav.tabs button[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
nav.tabs button:hover:not([aria-current="true"]){background:var(--paper2);color:var(--ink)}

main{padding-block:28px 64px}
.view{display:grid;gap:24px}
.lead{max-width:65ch;color:var(--muted)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:500}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{padding:5px 11px;font-size:.88rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;background:var(--paper2);border:1px solid var(--line);font-size:.8rem;color:var(--muted)}

/* escada de níveis (curvas de nível) */
.ladder{display:grid;gap:0;border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.band{display:grid;grid-template-columns:110px 1fr auto;gap:16px;align-items:center;padding:16px 18px;border:0;text-align:left;cursor:pointer;background:var(--paper);border-top:1px solid var(--line);width:100%}
.band:first-child{border-top:0}
.band .alt{display:grid;gap:2px}
.band .sw{height:12px;border-radius:3px}
.band .alt span{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.band h3{font-size:1.1rem}
.band p{color:var(--muted);font-size:.9rem}
.band[disabled]{cursor:not-allowed;opacity:.6}
.band:hover:not([disabled]){background:var(--paper2)}
.bar{height:8px;background:var(--paper2);border-radius:99px;overflow:hidden;border:1px solid var(--line);min-width:90px}
.bar i{display:block;height:100%;background:var(--accent)}

/* módulo */
.stepper{display:flex;gap:6px;flex-wrap:wrap}
.stepper button{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:.85rem;display:flex;gap:6px;align-items:center}
.stepper button[aria-current="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.stepper .dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.stepper .dot.done{background:var(--ok)}
.lesson{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.lesson .blk{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.lesson .blk.wide{grid-column:1/-1}
.lesson h4{font-family:var(--f-mono);font-weight:500;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.lesson .blk.mis{background:var(--warn-soft)}
dl.terms{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:0}
dl.terms dt{font-weight:600}
dl.terms dd{margin:0;color:var(--muted)}
ul.clean{margin:0;padding-left:1.1em;display:grid;gap:6px}

/* documentos */
figure.doc{margin:0;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:grid;gap:6px;min-width:0}
figure.doc img{display:block;width:100%;height:auto;border-radius:6px;background:#fff}
figure.doc figcaption{font-size:.82rem;color:var(--muted)}
figure.doc figcaption b{font-family:var(--f-mono);font-weight:500;color:var(--ink)}
.docs{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.imgmiss{display:grid;place-items:center;min-height:140px;border:2px dashed var(--line);border-radius:6px;color:var(--muted);font-size:.85rem;text-align:center;padding:12px}

/* exercícios */
.ex{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:grid;gap:14px;min-width:0}
.ex .q{font-weight:500;font-size:1.04rem}
.ex .meta{display:flex;gap:8px;flex-wrap:wrap}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--paper2);text-align:left;width:100%}
.opt input{margin-top:5px;accent-color:var(--accent)}
.opt.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.imgopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.imgopt{border:2px solid var(--line);border-radius:10px;background:#fff;padding:6px;cursor:pointer;display:grid;gap:6px}
.imgopt img{width:100%;height:150px;object-fit:contain}
.imgopt.sel{border-color:var(--accent)} .imgopt.right{border-color:var(--ok)} .imgopt.wrong{border-color:var(--bad)}
.imgopt span{font-size:.85rem;color:#16374b;text-align:center}
table.match{border-collapse:collapse;width:100%}
.tscroll{overflow-x:auto}
table.match th{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-weight:500}
table.match td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.match select{width:100%;min-width:140px;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--paper2)}
select.right,input.right,textarea.right{border-color:var(--ok)!important;background:var(--ok-soft)!important}
select.wrong,input.wrong,textarea.wrong{border-color:var(--bad)!important;background:var(--bad-soft)!important}
.tf{display:grid;gap:8px}
.tfrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper2)}
.tfrow .vf{display:flex;gap:6px}
.tfrow .vf button{width:40px;height:36px;border-radius:6px;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-weight:600}
.tfrow .vf button.sel{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tfrow.right{border-color:var(--ok)} .tfrow.wrong{border-color:var(--bad)}
.tfrow .fix{grid-column:1/-1}
textarea,input[type=text]{width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:var(--paper2)}
textarea{min-height:76px;resize:vertical}
.hot{position:relative;overflow:hidden;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:crosshair;max-width:640px}
.hot .inner{position:relative}
.hot img{display:block;max-width:none;height:auto}
.hot .pin{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:3px solid var(--bad);background:rgba(255,255,255,.4);pointer-events:none}
.hot .pin.ok{border-color:var(--ok)}
.hot .zone{position:absolute;border:2px dashed #2c7a4f;border-radius:6px;pointer-events:none}
.order{display:grid;gap:6px}
.order li{list-style:none;display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper2)}
.order ol{margin:0;padding:0;display:grid;gap:6px}
.order li .n{font-family:var(--f-mono);color:var(--muted);width:20px}
.order li span.t{flex:1}
.order li button{border:1px solid var(--line);background:var(--paper);border-radius:6px;width:32px;height:30px;cursor:pointer}
.fb{border-radius:8px;padding:12px 14px;display:grid;gap:6px;font-size:.95rem}
.fb.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.fb.no{background:var(--bad-soft);border:1px solid var(--bad)}
.fb.info{background:var(--paper2);border:1px solid var(--line)}
.fb b.h{font-family:var(--f-display);font-size:1.05rem}
.fb .mis{font-size:.9rem}
.fb a, .linkbtn{color:var(--accent);cursor:pointer;text-decoration:underline;background:none;border:0;padding:0}

/* laboratório */
.labgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.labcard{display:grid;gap:8px;text-align:left;cursor:pointer;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px;width:100%}
.labcard:hover{border-color:var(--accent)}
.labcard p{color:var(--muted);font-size:.92rem}
.analogy{border-left:4px solid var(--land);background:var(--land-soft);padding:12px 14px;border-radius:0 8px 8px 0}
.stepbox{display:grid;gap:14px}

/* teste e relatório */
.tq-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.diff{display:inline-flex;gap:3px;align-items:flex-end}
.diff i{width:8px;border-radius:2px;background:var(--line)}
.diff i.on{background:var(--lvA)}
.score{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.ring{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:1.8rem;font-weight:800}
.ring span{background:var(--paper);width:92px;height:92px;border-radius:50%;display:grid;place-items:center}
.cbars{display:grid;gap:10px}
.cbar{display:grid;grid-template-columns:minmax(0,220px) 1fr 52px;gap:12px;align-items:center;font-size:.92rem}
.cbar .track{height:12px;background:var(--paper2);border-radius:99px;border:1px solid var(--line);overflow:hidden}
.cbar .track i{display:block;height:100%}
.cbar b{font-family:var(--f-mono);font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:.75rem;font-weight:600}
.pill.alta{background:var(--bad-soft);color:var(--bad)} .pill.media{background:var(--warn-soft);color:var(--lvA)} .pill.ok{background:var(--ok-soft);color:var(--ok)}
.plan{display:grid;gap:12px;counter-reset:p}
.plan .pi{display:grid;gap:6px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--paper)}
.errs{display:grid;gap:10px}
.errs .e{padding:12px 14px;border-radius:8px;background:var(--paper2);border:1px solid var(--line);display:grid;gap:4px;font-size:.93rem}

/* glossário e professor */
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.gloss .g{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.gloss .g b{font-family:var(--f-display);font-size:1.02rem}
.gloss .g p{color:var(--muted);font-size:.92rem}
.prof{display:grid;gap:16px}
.prof section{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;display:grid;gap:10px}
.prof li{max-width:75ch}
.rank{display:grid;gap:10px;margin:0;padding:0;list-style:none;counter-reset:r}
.rank li{counter-increment:r;display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:start}
.rank li::before{content:counter(r);font-family:var(--f-display);font-weight:800;font-size:1.4rem;color:var(--lvA);text-align:center}
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:center}
.hero .name{display:grid;gap:6px;max-width:340px}
.hero label{font-size:.85rem;color:var(--muted)}
.legend-note{font-size:.82rem;color:var(--muted)}
.gate{display:grid;gap:14px;max-width:560px}
.gatef,.cfgf{display:grid;gap:12px}
.gatef label,.cfgf label{display:grid;gap:4px;font-size:.9rem}
.send{display:grid;gap:10px}
.send a.btn{text-decoration:none;display:inline-block}
.prof section.cfg{border-color:var(--accent)}
details summary{cursor:pointer;color:var(--accent);font-weight:500}
pre.code{background:var(--paper2);border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto;font-family:var(--f-mono);font-size:.78rem;line-height:1.5;margin:0;white-space:pre}
@media (max-width:720px){
  .lesson{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr}
  .band{grid-template-columns:72px 1fr}
  .band .bar{grid-column:1/-1}
  .cbar{grid-template-columns:1fr 46px}
  .cbar .track{grid-column:1/-1;grid-row:2}
  dl.terms{grid-template-columns:1fr}
  dl.terms dd{margin-bottom:6px}
  .score{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){.fb{animation:pop .25s ease-out}@keyframes pop{from{transform:translateY(4px);opacity:.4}to{transform:none;opacity:1}}}
</style>

<header class="top">
  <div class="wrap topin">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="15" fill="none" stroke="currentColor" stroke-width="2"></circle><ellipse cx="17" cy="17" rx="7" ry="15" fill="none" stroke="currentColor" stroke-width="1.2"></ellipse><line x1="2" y1="17" x2="32" y2="17" stroke="currentColor" stroke-width="1.2"></line><path d="M11 12 l4 -2 l3 1 l1 3 l-2 3 l-4 1 l-2 -2z" fill="#e3ae4f"></path></svg>

</header>

<script>
/* ============ IMAGENS (ficheiros locais) ============ */
const IMG = {
  C:{globo:'imagem1c.jpg',planisferio:'imagem2c.jpg',linhas:'imagem3c.jpg',europa:'imagem4c.jpg',planicie:'imagem5c.jpg',montanha:'imagem6c.jpg',zonas:'imagem7c.jpg',rios:'imagem8c.jpg'},
  B:{globo:'imagem1b.jpg',aerea:'imagem2b.jpg',satelite:'imagem3b.jpg',planisferio:'imagem4b.jpg',linhas:'imagem5b.jpg',europa:'imagem6b.jpg',relevo:'imagem7b.jpg',climas:'imagem8b.jpg',zonas:'imagem9b.jpg',rios:'imagem10b.jpg',vegetacao:'imagem11b.jpg'},
  A:{planisferio:'imagem1a.jpg',satelite:'imagem2a.jpg',aerea:'imagem3a.jpg',globo:'imagem4a.jpg',linhas:'imagem5a.jpg',europa:'imagem6a.jpg',relevo:'imagem7a.jpg',climas:'imagem8a.jpg',zonas:'imagem9a.jpg',rios:'imagem10a.jpg',vegetacao:'imagem11a.jpg'}
};

/* ============ ENVIO DE RESULTADOS (configuração do professor) ============
   email: endereço do professor (botão que abre o programa de correio)
   script: URL /exec do Google Apps Script (envio automático + registo numa folha Google)
   Pode preencher aqui ou na área do Professor (botão «Guardar versão dos alunos…»). */
const CONFIG = {"email":"","script":"https://script.google.com/macros/s/AKfycbyEVa6LSTPWMrFBTrA0MMjVuxm_UMy74OlmkjVwRcJ19-DDdtrYN25K1T_eIUy1NDPh/exec"}; /*CONFIG*/
const SRC = '<!doctype html>\n' + document.documentElement.outerHTML;
/* Versão do aluno: quando a configuração está incorporada no ficheiro, a área do Professor fica escondida. */
const ALUNO = !!(CONFIG.email || CONFIG.script);

/* ============ CONCEITOS E EQUÍVOCOS ============ */
const CONCEPTS = {
  rep:{n:'Representações da Terra', lab:null},
  lin:{n:'Linhas imaginárias e hemisférios', lab:'zonas'},
  map:{n:'Elementos do mapa e escala', lab:'escala'},
  ori:{n:'Orientação e localização', lab:'orientacao'},
  rel:{n:'Relevo', lab:'relevo'},
  cli:{n:'Clima', lab:'clima'},
  zon:{n:'Zonas climáticas', lab:'zonas'},
  rio:{n:'Rios e cursos de água', lab:null},
  veg:{n:'Vegetação natural', lab:'vegetacao'}
};

 {id:'c5',concept:'zon',title:'As zonas climáticas',doc:null,

 {id:'b2',concept:'lin',title:'A legenda completa das linhas imaginárias',doc:{k:'linhas',cap:'Doc. 2 – Linhas imaginárias do globo'},

 {id:'b3',concept:'map',title:'Elementos do mapa, escala e localização',doc:{k:'europa',cap:'Doc. 3 – A Península Ibérica na Europa'},
  lesson:{c:'Um mapa completo tem cinco elementos essenciais: <b>título, orientação, escala, legenda e fonte</b>. A <b>escala</b> indica quantas vezes a realidade foi reduzida. Um mapa de <b>pequena escala</b> mostra uma área grande com pouco pormenor; um de <b>grande escala</b> mostra uma área pequena com muito pormenor. Para localizar, usamos os <b>pontos cardeais</b> (N, S, E, O) e <b>colaterais</b> (NE, NO, SE, SO).',
   t:[['Escala gráfica','Barra que mostra a que distância real corresponde um segmento do mapa.'],['Orientação','Indicação do Norte (seta ou rosa-dos-ventos).'],['Rosa-dos-ventos','Figura com os pontos cardeais e colaterais.'],['Legenda','Explicação das cores e símbolos do mapa.']],
   p:'Neste mapa, a barra de escala diz que cerca de 1 cm corresponde a 500 km. O mapa mostra um continente inteiro, por isso é de pequena escala.',

      {type:'mc',q:'Classifica o mapa do documento 3 quanto ao tipo de escala.',opts:['Pequena escala','Grande escala'],a:0,mis:{1:'escala'},exp:'Mostra um continente inteiro com pouco pormenor: pequena escala.'},
      {type:'mc',concept:'ori',q:'Segundo o documento 3, em relação à Europa, a Península Ibérica localiza-se…',opts:['a sudoeste','a noroeste'],a:0,mis:{1:'colateral'},exp:'Está em baixo (Sul) e à esquerda (Oeste): sudoeste.'},
      {type:'mc',concept:'lin',q:'A Europa localiza-se no hemisfério…',opts:['norte','central'],a:0,mis:{1:'hemisferio-central'},exp:'A Europa fica toda a norte do Equador.'},

 {id:'b4',concept:'rel',title:'O relevo da Península Ibérica',doc:{k:'relevo',cap:'Doc. 1 – Relevo da Península Ibérica'},
  lesson:{c:'Num mapa de relevo, as cores indicam a altitude: tons claros para as zonas baixas e castanhos para as altas. No interior da Península fica a <b>Meseta Ibérica</b>, um enorme <b>planalto</b> (terreno alto e plano). À volta e no meio dela erguem-se <b>cordilheiras</b>: Cantábrica, Central, Ibérica e Bética. As planícies ficam sobretudo junto ao litoral e aos grandes rios.',
   t:[['Planalto','Superfície plana a altitude elevada.'],['Meseta','Nome do grande planalto do centro da Península.'],['Cordilheira','Conjunto de montanhas em fila.'],['Serra','Conjunto de montanhas mais pequeno (ex.: Serra da Estrela).']],
   p:'A Serra da Estrela, na Cordilheira Central, tem o ponto mais alto de Portugal continental (1993 m).',
   e:['«O castanho escuro quer dizer terra seca.» Quer dizer altitude elevada: mais de 1000 m.','«O interior da Península é uma planície.» É um planalto, a Meseta.']},
  ex:[{type:'mc',q:'Assinala a afirmação correta.',opts:['A Península Ibérica possui várias regiões montanhosas, como as cordilheiras e as mesetas.','O Sul da Península Ibérica é constituído, maioritariamente, por regiões montanhosas.','O litoral da Península Ibérica é constituído, maioritariamente, por regiões montanhosas.'],a:0,mis:{2:'hipsometria'},exp:'A Península tem muitas regiões elevadas. Atenção: a meseta é um planalto (alto e plano), não uma montanha; a frase da ficha junta-as como «regiões elevadas». O litoral é sobretudo de planícies.'}]},
 {id:'b5',concept:'cli',title:'Climas e zonas climáticas',doc:{k:'climas',cap:'Doc. 2 – Climas da Península Ibérica'},
  lesson:{c:'O <b>clima</b> é o conjunto das condições de temperatura e chuva de um lugar ao longo de muitos anos. Na Península há três climas: <b>temperado marítimo</b> (norte e noroeste, perto do oceano: chuva abundante e temperaturas amenas), <b>temperado continental</b> (interior: verões muito quentes e invernos muito frios) e <b>temperado mediterrâneo</b> (sul: pouca chuva, verão quente e inverno ameno).',
   t:[['Clima','Condições médias de temperatura e precipitação durante muitos anos.'],['Estado do tempo','Condições da atmosfera num momento (hoje, amanhã).'],['Precipitação','Água que cai da atmosfera: chuva, neve, granizo.'],['Ameno','Nem muito quente nem muito frio.']],
   p:'Em Lisboa e Faro o clima é mediterrâneo; em Madrid é continental; no Porto é marítimo.',
   e:['«Clima é o tempo que faz hoje.» O tempo muda todos os dias; o clima é a média de muitos anos.','«Clima mediterrâneo só existe junto ao Mar Mediterrâneo.» Lisboa e Faro, no Atlântico, também o têm.']},
  ex:[{type:'match',q:'Liga cada área climática à respetiva definição.',rows:['Clima temperado marítimo','Clima temperado continental','Clima temperado mediterrâneo'],cols:[{h:'Definição',opts:['Temperaturas altas no verão e amenas no inverno','Temperaturas amenas','Temperaturas muito altas no verão e muito baixas no inverno'],a:[1,2,0]}],mis:{any:'mar-clima'},exp:'Marítimo → temperaturas amenas; continental → muito altas no verão e muito baixas no inverno; mediterrâneo → altas no verão e amenas no inverno.'},
      {type:'mc',concept:'zon',q:'Identifica a zona climática onde se situa a Península Ibérica (documento 3).',img:'zonas',opts:['Zona temperada do norte','Zona quente','Zona temperada do sul'],a:0,mis:{2:'temperada-sul'},exp:'A Península está no hemisfério norte, entre a zona quente e a zona fria do Norte.'},
      {type:'match',concept:'zon',q:'Completa a legenda do documento 3.',img:'zonas',rows:['Caixa de cima (junto ao Polo Norte)','Caixa de baixo (junto ao Polo Sul)'],cols:[{h:'Zona',opts:['Zona fria do Norte','Zona fria do Sul','Zona quente','Zona temperada do Sul'],a:[0,1]}],exp:'Junto aos polos ficam as zonas frias: do Norte e do Sul.'}]},
 {id:'b6',concept:'rio',title:'Rios da Península e das ilhas',doc:{k:'rios',cap:'Doc. 4 – Rios de Portugal'},
  lesson:{c:'Os quatro grandes rios luso-espanhóis são o <b>Minho, Douro, Tejo e Guadiana</b>. O Minho e o Guadiana fazem, em parte, fronteira entre os dois países. Nos <b>Açores e na Madeira</b>, as ilhas são pequenas e montanhosas, por isso não há rios: há <b>ribeiras</b>, <b>lagoas</b> (nas crateras de vulcões, nos Açores) e <b>levadas</b>.',
   t:[['Ribeira','Pequeno curso de água, muitas vezes com pouca água no verão.'],['Lagoa','Massa de água parada, menor do que um lago.'],['Levada','Canal construído pelas pessoas para levar água de rega, típico da Madeira.'],['Estuário','Foz larga de um rio, onde a água doce se mistura com a do mar.']],
   p:'Junto ao Barreiro, o Tejo forma um estuário. Ali desagua também o rio Coina, um rio nacional.',
   e:['«As ilhas têm rios.» Têm ribeiras: as ilhas são pequenas e a água corre depressa para o mar.','«As levadas são naturais.» Foram construídas pelas pessoas.']},
  ex:[{type:'multi',q:'Assinala os <b>quatro</b> rios luso-espanhóis.',opts:['Minho','Guadiana','Vouga','Tejo','Douro','Cávado','Sado','Mira'],a:[0,1,3,4],mis:{2:'rio-nacional',5:'rio-nacional',6:'rio-nacional',7:'rio-nacional'},exp:'Minho, Douro, Tejo e Guadiana. Vouga, Cávado, Sado e Mira são rios nacionais.'},
      {type:'reflect',q:'Identifica o rio nacional que se situa mais próximo da tua localidade (pode não estar no mapa).',exp:'A resposta depende de onde vives. No Barreiro, o grande rio é o Tejo (luso-espanhol), e o rio nacional mais próximo é o Coina, que desagua no estuário do Tejo. Perto de Setúbal fica o Sado.'},
      {type:'multi',q:'Assinala os cursos de água existentes nos arquipélagos dos Açores e da Madeira.',opts:['Ribeiras','Levadas','Rios','Mares','Lagoas','Rias'],a:[0,1,4],mis:{2:'ilhas-rios'},exp:'Ribeiras, lagoas e levadas. As levadas são canais artificiais, construídos para levar água.'}]},
 {id:'b7',concept:'veg',title:'Ibéria Húmida e Ibéria Seca',doc:{k:'vegetacao',cap:'Doc. 5 – Ibéria Húmida e Ibéria Seca'},
  lesson:{c:'A vegetação natural depende do clima. A <b>Ibéria Húmida</b> ocupa o Norte e o Noroeste, onde chove muito: predominam árvores de <b>folha caduca</b> (carvalho, castanheiro), que perdem as folhas no outono. A <b>Ibéria Seca</b> ocupa o Centro e o Sul, onde chove pouco: predominam árvores de <b>folha persistente</b> (sobreiro, azinheira, oliveira), com folhas pequenas e duras que poupam água.',
   t:[['Folha caduca','Folha que cai toda no outono.'],['Folha persistente','Folha que se mantém todo o ano e se renova aos poucos.'],['Vegetação natural','Plantas que crescem sem ser semeadas pelas pessoas.']],
   p:'Os montados de sobreiro do Alentejo, de onde vem a cortiça, são típicos da Ibéria Seca.',
   e:['«Folha persistente nunca cai.» Cai, mas aos poucos: a árvore nunca fica despida.','«Ibéria Seca é um deserto.» Chove pouco, mas há florestas e campos.']},
  ex:[{type:'tf',q:'Classifica em verdadeiras (V) ou falsas (F) as afirmações.',items:[{t:'A Ibéria Húmida abrange o Sul e o Sudoeste da Península.',v:false},{t:'Na Ibéria Húmida predomina a vegetação natural de folha caduca.',v:true},{t:'A Ibéria Seca abrange o Centro e o Sul da Península.',v:true}],mis:{any:'caduca'},exp:'A Ibéria Húmida abrange o Norte e o Noroeste. As outras duas afirmações são verdadeiras.'}]}
 ],
 recap:{points:['Fotografia aérea: tirada de avião ou drone. Imagem de satélite: captada do Espaço.','Trópico de Câncer no norte, de Capricórnio no sul; círculos polares junto aos polos.','Cinco elementos do mapa: título, orientação, escala, legenda e fonte.','Pequena escala = área grande, pouco pormenor.','A Meseta é um planalto; as cordilheiras são conjuntos de montanhas.','Três climas: marítimo (ameno, chuvoso), continental (extremos), mediterrâneo (verão quente e seco).','Ilhas: ribeiras, lagoas e levadas. Húmida → folha caduca; Seca → folha persistente.'],
  quiz:[{type:'mc',concept:'map',q:'Uma planta da tua escola, com todas as salas, é um mapa de…',opts:['grande escala','pequena escala'],a:0,mis:{1:'escala'},exp:'Área pequena com muito pormenor = grande escala.'},
   {type:'mc',concept:'lin',q:'Que linha fica entre o Equador e o círculo polar ártico?',opts:['Trópico de Câncer','Trópico de Capricórnio','Círculo polar antártico'],a:0,exp:'Câncer fica no hemisfério norte.'},
   {type:'mc',concept:'cli',q:'Madrid tem verões muito quentes e invernos muito frios. Que clima é este?',opts:['Temperado continental','Temperado marítimo','Temperado mediterrâneo'],a:0,mis:{1:'mar-clima'},exp:'O interior, longe do mar, tem temperaturas extremas.'},
   {type:'mc',concept:'veg',q:'O castanheiro perde as folhas no outono. A sua folha é…',opts:['caduca','persistente'],a:0,mis:{1:'caduca'},exp:'Caduca = cai.'}]}},

A:{modules:[
 {id:'a1',concept:'rep',title:'Representações da Terra: vantagens e limites',docs:[{k:'planisferio',cap:'A'},{k:'satelite',cap:'B'},{k:'aerea',cap:'C'},{k:'globo',cap:'D'}],docsCap:'Doc. 1 – Formas de representação da Terra',
  lesson:{c:'Cada representação tem vantagens e limites. O globo mantém as formas e as áreas, mas não mostra pormenor e não se leva no bolso. O planisfério mostra o mundo inteiro de uma vez, mas resulta de uma <b>projeção cartográfica</b>: ao passar a esfera para o plano, há sempre deformações. As imagens de satélite e as fotografias aéreas mostram a realidade como ela é num certo momento.',
   t:[['Projeção cartográfica','Método para passar a superfície esférica da Terra para um plano.'],['Deformação','Alteração das formas, áreas ou distâncias num mapa.'],['Deteção remota','Recolha de informação à distância, por exemplo com satélites.']],
   p:'Na projeção mais usada nos planisférios escolares, os países perto dos polos parecem maiores do que são: a Gronelândia parece do tamanho de África, mas África é cerca de 14 vezes maior.',
   e:['«Uma imagem de satélite é um mapa.» Não tem título, legenda nem escala: é uma imagem. Os mapas são construídos a partir dela.','«Uma fotografia aérea só pode ser tirada por um drone.» Também pode ser tirada de um avião ou helicóptero.']},
  ex:[{type:'match',q:'Completa o quadro: para cada afirmação, escreve a letra da imagem e o conceito correspondente (sem chave).',rows:['Representação da Terra que mais se aproxima da realidade.','Representação da totalidade da Terra numa superfície plana.','Imagem de parte da Terra captada por um drone.','Representação da Terra captada a partir do Espaço.'],cols:[{h:'Imagem',opts:['A','B','C','D'],a:[3,0,2,1]},{h:'Conceito',opts:['Planta','Globo terrestre','Mapa de relevo','Planisfério','Fotografia aérea','Imagem de satélite'],a:[1,3,4,5]}],mis:{any:'rep-satelite'},exp:'D – Globo terrestre; A – Planisfério; C – Fotografia aérea; B – Imagem de satélite.'},
      {type:'text',q:'Explica, por palavras tuas, porque é que o planisfério deforma a realidade.',groups:[['plan','achat','folha','papel','superficie plana'],['esfer','redond','curv','bola','globo']],need:2,model:'Porque a Terra é esférica (redonda) e o planisfério é plano: ao passar a esfera para uma folha, as formas e as áreas ficam deformadas.',mis:{fail:'planisferio'},exp:'A ideia-chave junta duas coisas: a Terra é redonda e o planisfério é plano.'}]},
 {id:'a2',concept:'lin',title:'Linhas imaginárias e o que limitam',doc:{k:'linhas',cap:'Doc. 2 – Linhas imaginárias do globo'},
  lesson:{c:'Os paralelos e os meridianos formam uma rede que permite dar a <b>localização absoluta</b> de qualquer lugar, com as <b>coordenadas geográficas</b>: a latitude (distância ao Equador) e a longitude (distância a Greenwich). Os trópicos e os círculos polares são também os limites das zonas climáticas.',
   t:[['Latitude','Distância de um lugar ao Equador, medida em graus (N ou S).'],['Longitude','Distância de um lugar ao Meridiano de Greenwich, medida em graus (E ou O).'],['Hemisfério ocidental','Metade da Terra a oeste de Greenwich.'],['Coordenadas geográficas','Par latitude/longitude que localiza um ponto.']],
   p:'Portugal continental fica no hemisfério norte e no hemisfério ocidental: está todo a oeste do Meridiano de Greenwich.',
   e:['«Os trópicos estão nos polos.» Ficam perto do Equador e limitam a zona quente.','«Greenwich é o meridiano de Portugal.» Passa em Londres; Portugal fica a oeste dele.']},
  ex:[{type:'match',q:'Legenda o documento 2 (há opções a mais).',rows:['A','B','C','D','1','2','3','4'],cols:[{h:'Legenda',opts:['Equador','Trópico de Câncer','Trópico de Capricórnio','Meridiano de Greenwich','Polo Norte','Polo Sul','Círculo Polar Ártico','Círculo Polar Antártico','Meridiano de Lisboa','Paralelo de Portugal'],a:[1,2,3,0,6,5,4,7]}],mis:{any:'lin-troca'},exp:'A – Trópico de Câncer; B – Trópico de Capricórnio; C – Meridiano de Greenwich; D – Equador; 1 – Círculo Polar Ártico; 2 – Polo Sul; 3 – Polo Norte; 4 – Círculo Polar Antártico.'},
      {type:'mc',concept:'zon',q:'Que linhas limitam a zona quente ou intertropical?',opts:['Trópico de Câncer e Trópico de Capricórnio','Círculo polar ártico e círculo polar antártico','Equador e Meridiano de Greenwich'],a:0,exp:'A zona quente fica entre os dois trópicos, daí o nome «intertropical».'}]},
 {id:'a3',concept:'map',title:'Ler um mapa como um geógrafo',doc:{k:'europa',cap:'Doc. 3 – A Península Ibérica na Europa'},
  lesson:{c:'A escala pode ser <b>gráfica</b> (uma barra) ou <b>numérica</b> (por exemplo, 1:1 000 000, que quer dizer que 1 cm no mapa são 1 000 000 cm, ou seja 10 km, na realidade). Quanto maior o número depois dos dois pontos, menor é a escala. A <b>localização relativa</b> descreve um lugar em relação a outro (a PI fica a sudoeste da Europa); a <b>localização absoluta</b> usa coordenadas.',
   t:[['Escala numérica','Fração que indica a redução: 1:50 000, 1:5 000 000…'],['Localização relativa','Posição de um lugar em relação a outros.'],['Localização absoluta','Posição exata dada por coordenadas geográficas.'],['Fonte','Indicação de onde vem a informação do mapa.']],
   p:'Para saber a distância de Lisboa a Madrid num mapa, medes com a régua e comparas com a barra de escala: cerca de 1 cm para 100 km num mapa da Península dá perto de 500 km.',
   e:['«1:5 000 000 é uma escala maior do que 1:50 000 porque o número é maior.» É o contrário: quanto mais se reduz, menor é a escala.','Confundir sudeste com sudoeste: lê sempre primeiro Norte/Sul.']},
  ex:[{type:'text',q:'Indica três dos cinco elementos essenciais de um mapa, com base no documento 3.',groups:[['titulo'],['orientac','rosa','seta','norte'],['escala'],['legenda'],['fonte']],need:3,model:'Três dos cinco elementos essenciais de um mapa presentes no documento 3 são a orientação, a escala e o título.',exp:'Os cinco elementos são título, orientação, escala, legenda e fonte. No documento 3 vê-se a orientação e a escala, e o título está no topo do documento.'},
      {type:'text',q:'Classifica o mapa representado no documento 3 quanto ao tipo de escala.',groups:[['pequena']],need:1,forbid:['grande escala'],model:'O mapa representado no documento 3 é um mapa de pequena escala.',mis:{fail:'escala'},exp:'Representa um continente (área grande) com pouco pormenor.'},
      {type:'mc',concept:'ori',q:'Segundo o documento 3, em relação à Europa, a Península Ibérica localiza-se…',opts:['a sudeste','a sudoeste','a noroeste'],a:1,mis:{0:'colateral',2:'colateral'},exp:'Sul + Oeste = sudoeste.'},
      {type:'mc',concept:'lin',q:'A Europa localiza-se no hemisfério…',opts:['norte','sul','central'],a:0,mis:{2:'hemisferio-central'},exp:'Toda a Europa fica a norte do Equador.'},
      {type:'mc',concept:'ori',q:'A Península Ibérica é banhada pelo oceano…',opts:['Pacífico','Atlântico','Índico'],a:1,exp:'Atlântico, a oeste e a norte.'}]},
 {id:'a4',concept:'rel',title:'Relevo: montanha, planalto e planície',doc:{k:'relevo',cap:'Doc. 1 – Relevo da Península Ibérica'},
  lesson:{c:'Distinguir as três formas principais: <b>montanha</b> (alta e com declives acentuados), <b>planalto</b> (alto e plano) e <b>planície</b> (baixa e plana). O relevo da Península organiza-se à volta da Meseta, rodeada de cordilheiras. Portugal tem o relevo mais alto a norte do Tejo e mais baixo a sul.',
   t:[['Declive','Inclinação do terreno.'],['Mapa hipsométrico','Mapa que usa cores para mostrar as altitudes.'],['Vale','Terreno mais baixo entre elevações, muitas vezes com um rio.']],
   p:'O ponto mais alto de Portugal é a montanha do Pico, nos Açores (2351 m). No continente é a Serra da Estrela (1993 m).',
   e:['«Planalto e planície são a mesma coisa.» Ambos são planos; a diferença está na altitude.','«O interior da Península é feito de planícies.» É ocupado pela Meseta, um planalto.']},
  ex:[{type:'mc',q:'Assinala a afirmação correta.',opts:['A Península Ibérica possui várias regiões montanhosas, como as cordilheiras e as mesetas.','O Sul da Península Ibérica é constituído, maioritariamente, por regiões montanhosas.','O litoral da Península Ibérica é constituído, maioritariamente, por regiões montanhosas.','O interior da Península é constituído, maioritariamente, por planícies.'],a:0,mis:{3:'meseta',2:'hipsometria'},exp:'O interior é ocupado pela Meseta (planalto); o litoral e o sul têm sobretudo planícies.'},
      {type:'text',q:'Que forma de relevo é a Meseta Ibérica? Justifica.',groups:[['planalto'],['alt','elevad'],['plan']],need:2,forbid:['planicie','e uma montanha'],model:'A Meseta Ibérica é um planalto, porque é uma superfície plana situada a uma altitude elevada.',mis:{fail:'meseta'},exp:'Planalto = plano + alto.'}]},
 {id:'a5',concept:'cli',title:'Clima: o que o explica',doc:{k:'climas',cap:'Doc. 2 – Climas da Península Ibérica'},
  lesson:{c:'O clima de um lugar depende de vários <b>fatores</b>: a <b>latitude</b> (distância ao Equador), a <b>proximidade do mar</b> (o oceano aquece e arrefece devagar e suaviza as temperaturas) e o <b>relevo</b> (as montanhas fazem chover mais de um lado e travam a influência do mar). Na Península, a latitude explica que todo o território seja temperado; o mar e o relevo explicam as diferenças entre marítimo, continental e mediterrâneo.',
   t:[['Fator climático','Causa que influencia o clima de um lugar.'],['Amplitude térmica','Diferença entre a temperatura mais alta e a mais baixa.'],['Continentalidade','Efeito da distância ao mar: mais longe, maior amplitude térmica.']],
   p:'O Porto e Madrid ficam quase à mesma latitude, mas Madrid, longe do mar e a mais de 600 m de altitude, tem invernos bem mais frios.',
   e:['Descrever os climas só com temperaturas. A chuva também conta: o marítimo tem chuva abundante; o mediterrâneo tem pouca.','«O mar aquece o litoral.» No verão até o refresca; o que faz é suavizar as temperaturas todo o ano.']},
  ex:[{type:'match',q:'Associa cada área climática à respetiva definição (há uma definição a mais).',rows:['Clima temperado marítimo','Clima temperado continental','Clima temperado mediterrâneo'],cols:[{h:'Definição',opts:['Temperaturas altas no verão e amenas no inverno','Temperaturas amenas','Temperaturas muito altas no verão e muito baixas no inverno','Temperaturas baixas durante todo o ano'],a:[1,2,0]}],mis:{any:'mar-clima'},exp:'Marítimo → amenas; continental → extremos; mediterrâneo → verão quente e inverno ameno.'},
      {type:'text',concept:'zon',q:'Identifica a zona climática onde se situa a Península Ibérica, a partir do documento 3.',img:'zonas',groups:[['temperada'],['norte']],need:2,forbid:['sul','quente'],model:'A Península Ibérica localiza-se na Zona Temperada do Norte.',mis:{fail:'temperada-sul'},exp:'Zona temperada do Norte: hemisfério norte, entre o Trópico de Câncer e o círculo polar ártico.'},
      {type:'text',concept:'zon',q:'Completa a legenda do documento 3: que nome têm as zonas das duas caixas?',img:'zonas',groups:[['fria','glacial','polar'],['norte','artic'],['sul','antartic']],need:3,model:'Caixa de cima: zona fria do Norte. Caixa de baixo: zona fria do Sul.',exp:'Junto aos polos ficam as zonas frias (também chamadas glaciais ou polares) do Norte e do Sul.'}]},
 {id:'a6',concept:'rio',title:'Rede hidrográfica',doc:{k:'rios',cap:'Doc. 4 – Rios de Portugal'},
  lesson:{c:'Um rio nasce na <b>nascente</b>, recebe <b>afluentes</b> e termina na <b>foz</b>. O conjunto de terras cujas águas correm para o mesmo rio é a sua <b>bacia hidrográfica</b>. Um rio é luso-espanhol quando a sua bacia se reparte por Portugal e Espanha.',
   t:[['Afluente','Rio que desagua noutro rio (o Zêzere é afluente do Tejo).'],['Bacia hidrográfica','Área drenada por um rio e pelos seus afluentes.'],['Margem','Cada um dos lados do rio (direita e esquerda, no sentido da corrente).']],
   p:'O Zêzere é o maior afluente português do Tejo. O Mondego é o maior rio inteiramente português.',
   e:['«Os quatro rios luso-espanhóis são os únicos que nascem em Espanha.» São os quatro principais; o Lima e o Tâmega, por exemplo, também nascem na Galiza.','Chamar «rio» a uma ribeira das ilhas.']},
  ex:[{type:'text',q:'Identifica os quatro rios luso-espanhóis.',anyOf:['minho','douro','tejo','guadiana'],need:4,model:'Os quatro rios luso-espanhóis são: o rio Minho, o rio Douro, o rio Tejo e o rio Guadiana.',mis:{fail:'rio-nacional'},exp:'Minho, Douro, Tejo e Guadiana (de norte para sul).'},
      {type:'text',q:'Identifica dois rios nacionais que se situam no Norte.',anyOf:['cavado','ave','neiva','leca'],need:2,model:'Os dois rios nacionais mais a norte são o Cávado e o Ave.',exp:'No mapa, a norte do Douro, os rios nacionais são o Cávado e o Ave. O Lima nasce em Espanha, por isso não conta.'},
      {type:'text',q:'Nomeia os cursos de água existentes nos arquipélagos dos Açores e da Madeira.',anyOf:['ribeira','lagoa','levada'],need:3,forbid:['rios'],model:'Ribeiras, lagoas e levadas.',mis:{fail:'ilhas-rios'},exp:'Ribeiras, lagoas (sobretudo nos Açores) e levadas (canais artificiais da Madeira).'}]},
 {id:'a7',concept:'veg',title:'Vegetação e clima',doc:{k:'vegetacao',cap:'Doc. 5 – Ibéria Húmida e Ibéria Seca'},
  lesson:{c:'A divisão em Ibéria Húmida e Ibéria Seca segue a quantidade de chuva. As plantas <b>adaptam-se</b>: na Ibéria Seca, as folhas pequenas, duras e com cera de sobreiros e azinheiras perdem menos água no verão seco. Nas montanhas, a altitude cria ilhas de vegetação diferente, mesmo no sul.',
   t:[['Adaptação','Característica que ajuda um ser vivo a viver num ambiente.'],['Montado','Paisagem de sobreiros e azinheiras espaçados, típica do Alentejo.'],['Floresta caducifólia','Floresta de árvores de folha caduca.']],
   p:'Portugal é o maior produtor mundial de cortiça, que vem do sobreiro, árvore de folha persistente da Ibéria Seca.',
   e:['«Na Ibéria Seca não há árvores.» Há montados, pinhais e matos.','Trocar as regiões: a Húmida é Norte e Noroeste; a Seca é Centro e Sul.']},
  ex:[{type:'tffix',q:'Classifica em verdadeiras (V) ou falsas (F) e corrige as falsas.',items:[{t:'A Ibéria Húmida abrange o Sul e o Sudoeste da Península.',v:false,fix:[['norte','noroeste']],model:'A Ibéria Húmida abrange o Norte e o Noroeste da Península.'},{t:'Na Ibéria Seca predomina a vegetação natural de folha caduca.',v:false,fix:[['persistent']],model:'Na Ibéria Seca predomina a vegetação natural de folha persistente.'},{t:'Na Ibéria Húmida predomina a vegetação natural de folha caduca.',v:true},{t:'A Ibéria Seca abrange o Centro e o Sul da Península.',v:true}],mis:{any:'caduca'},exp:'Falsas: a 1.ª (é Norte e Noroeste) e a 2.ª (é folha persistente).'}]}
 ],
 recap:{points:['O planisfério resulta de uma projeção e tem sempre deformações.','Latitude e longitude dão a localização absoluta; os trópicos e os círculos polares limitam as zonas climáticas.','Escala numérica: quanto maior o denominador, menor a escala.','Montanha (alta, inclinada), planalto (alto, plano), planície (baixa, plana).','Fatores do clima: latitude, proximidade do mar e relevo.','Bacia hidrográfica, afluente, foz; os quatro principais rios luso-espanhóis.','As plantas adaptam-se ao clima: folhas persistentes poupam água.'],
  quiz:[{type:'mc',concept:'map',q:'Qual destas escalas é a maior (mostra mais pormenor)?',opts:['1:5 000','1:500 000','1:5 000 000'],a:0,mis:{2:'escala'},exp:'Quanto menor o denominador, maior a escala.'},

const $=(s,r=document)=>r.querySelector(s);
function h(tag,attrs,...kids){const e=document.createElement(tag);if(attrs)for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;if(k==='html')e.innerHTML=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?'':v);}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c));}return e;}
function shuffle(n){const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function norm(s){return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();}
function has(text,k){const t=' '+norm(text)+' ';const kk=norm(k);if(kk.includes(' '))return t.includes(' '+kk);return t.split(' ').some(w=>w.startsWith(kk));}
function src(lvl,k){return (IMG[lvl]||{})[k]||k;}
window.imgFail=function(el){const d=h('div',{class:'imgmiss'},'Imagem em falta: '+el.getAttribute('src')+'. Coloca o ficheiro na mesma pasta desta aplicação.');el.replaceWith(d);};
function imgTag(file,alt,extra){return h('img',Object.assign({src:file,alt:alt||'',loading:'lazy',onerror:function(){imgFail(this);}},extra||{}));}
function fig(file,cap){return h('figure',{class:'doc'},imgTag(file,cap),cap?h('figcaption',{html:cap+' · <b>'+file+'</b>'}):null);}
function stripTags(s){return s.replace(/<[^>]+>/g,'');}

const TYPE_LABEL={mc:'Escolha múltipla',multi:'Seleção múltipla',tf:'Verdadeiro ou falso',tffix:'V/F com correção',match:'Associação',imgchoice:'Escolhe a imagem',imglabel:'Legendar imagens',hotspot:'Clica no mapa',text:'Resposta aberta',order:'Ordenar',reflect:'Reflexão'};

function exEl(ex,lvl,opt){
  opt=opt||{};
  const box=h('div',{class:'ex'});
  const meta=h('div',{class:'meta'},h('span',{class:'chip mono'},TYPE_LABEL[ex.type]||ex.type));
  if(opt.metaExtra) opt.metaExtra.forEach(m=>meta.append(m));
  box.append(meta,h('div',{class:'q',html:ex.q}));
  const L=ex.imgLvl||lvl;
  if(ex.img){const k=Array.isArray(ex.img)?ex.img[1]:ex.img;const ll=Array.isArray(ex.img)?ex.img[0]:L;const f=h('div',{style:'max-width:520px'},fig(src(ll,k),''));box.append(f);}
  const body=h('div',{});box.append(body);
  let st={}; let getAnswer, mark, answerText;
  if(ex.type==='mc'||ex.type==='multi'){
    const multi=ex.type==='multi'; const order=shuffle(ex.opts.length); st.sel=multi?new Set():null;
    const wrap=h('div',{class:'opts'}); const els=[];
    order.forEach(i=>{const inp=h('input',{type:multi?'checkbox':'radio',name:'x'+Math.random(),tabindex:'-1','aria-hidden':'true'});
      const b=h('button',{class:'opt',type:'button',onclick:()=>{if(st.locked)return;if(multi){st.sel.has(i)?st.sel.delete(i):st.sel.add(i);}else st.sel=i;els.forEach(o=>{const on=multi?st.sel.has(o.i):st.sel===o.i;o.b.classList.toggle('sel',on);o.inp.checked=on;});}},inp,h('span',{html:ex.opts[i]}));
      els.push({i,b,inp});wrap.append(b);});
    body.append(wrap);
    getAnswer=()=>{if(multi){if(!st.sel.size)return null;const a=new Set(ex.a);const ok=st.sel.size===a.size&&[...st.sel].every(x=>a.has(x));const mis=[...st.sel].filter(x=>!a.has(x)).map(x=>ex.mis&&ex.mis[x]).filter(Boolean);return{ok,mis};}
      if(st.sel==null)return null;return{ok:st.sel===ex.a,mis:st.sel!==ex.a&&ex.mis&&ex.mis[st.sel]?[ex.mis[st.sel]]:[]};};
    mark=()=>els.forEach(o=>{const correct=multi?ex.a.includes(o.i):o.i===ex.a;const chosen=multi?st.sel.has(o.i):st.sel===o.i;if(correct)o.b.classList.add('right');else if(chosen)o.b.classList.add('wrong');});
    answerText=()=>multi?ex.a.map(i=>stripTags(ex.opts[i])).join(', '):stripTags(ex.opts[ex.a]);
  }
  else if(ex.type==='tf'||ex.type==='tffix'){
    const wrap=h('div',{class:'tf'});st.v=ex.items.map(()=>null);const rows=[];
    ex.items.forEach((it,idx)=>{const fix=ex.type==='tffix'?h('input',{type:'text',class:'fix',placeholder:'Corrige a afirmação…',hidden:true,id:'fix'+Math.random().toString(36).slice(2)}):null;
      const bv=h('button',{type:'button','aria-label':'Verdadeiro'},'V'),bf=h('button',{type:'button','aria-label':'Falso'},'F');
      const set=val=>{if(st.locked)return;st.v[idx]=val;bv.classList.toggle('sel',val===true);bf.classList.toggle('sel',val===false);if(fix)fix.hidden=val!==false;};
      bv.onclick=()=>set(true);bf.onclick=()=>set(false);
      const r=h('div',{class:'tfrow'},h('span',{},it.t),h('div',{class:'vf'},bv,bf),fix);rows.push({r,fix});wrap.append(r);});
    body.append(wrap);
    getAnswer=()=>{if(st.v.some(v=>v===null))return null;let ok=true;st.fixOk=[];ex.items.forEach((it,i)=>{if(st.v[i]!==it.v)ok=false;if(ex.type==='tffix'&&it.v===false&&st.v[i]===false){const txt=rows[i].fix.value;const g=it.fix.every(alts=>alts.some(k=>has(txt,k)));st.fixOk[i]=g;if(!g)ok=false;}});
      return{ok,mis:ok?[]:(ex.mis&&ex.mis.any?[ex.mis.any]:[])};};
    mark=()=>ex.items.forEach((it,i)=>{const good=st.v[i]===it.v&&(st.fixOk[i]!==false);rows[i].r.classList.add(good?'right':'wrong');if(rows[i].fix&&!rows[i].fix.hidden)rows[i].fix.classList.add(st.fixOk[i]?'right':'wrong');});
    answerText=()=>ex.items.map(it=>(it.v?'V':'F')+(it.model?' – '+it.model:'')).join(' · ');
  }
  else if(ex.type==='match'){
    const tw=h('div',{class:'tscroll'});const t=h('table',{class:'match'});const hr=h('tr',{},h('th',{},'Afirmação'));ex.cols.forEach(c=>hr.append(h('th',{},c.h)));t.append(h('thead',{},hr));
    const tb=h('tbody');st.sels=[];
    ex.rows.forEach((r,ri)=>{const tr=h('tr',{},h('td',{},r));st.sels[ri]=[];ex.cols.forEach((c,ci)=>{const s=h('select',{id:'s'+Math.random().toString(36).slice(2),'aria-label':c.h+' para '+r},h('option',{value:''},'—'),c.opts.map((o,oi)=>h('option',{value:oi},o)));st.sels[ri][ci]=s;tr.append(h('td',{},s));});tb.append(tr);});
    t.append(tb);tw.append(t);body.append(tw);
    getAnswer=()=>{let empty=false,ok=true,right=0,tot=0;ex.rows.forEach((r,ri)=>ex.cols.forEach((c,ci)=>{const v=st.sels[ri][ci].value;if(v==='')empty=true;tot++;if(+v===c.a[ri]&&v!=='')right++;else ok=false;}));if(empty)return null;return{ok,partial:right/tot,mis:ok?[]:(ex.mis&&ex.mis.any?[ex.mis.any]:[])};};
    mark=()=>ex.rows.forEach((r,ri)=>ex.cols.forEach((c,ci)=>{const s=st.sels[ri][ci];s.classList.add(+s.value===c.a[ri]?'right':'wrong');s.disabled=true;}));
    answerText=()=>ex.rows.map((r,ri)=>r.replace(/\.$/,'')+' → '+ex.cols.map(c=>c.opts[c.a[ri]]).join(' / ')).join('; ');
  }
  else if(ex.type==='imgchoice'){
    const wrap=h('div',{class:'imgopts'});const els=[];
    ex.imgs.forEach((im,i)=>{const b=h('button',{type:'button',class:'imgopt',onclick:()=>{if(st.locked)return;st.sel=i;els.forEach((e,j)=>e.classList.toggle('sel',j===i));}},imgTag(src(L,im.k),im.l),h('span',{},im.l));els.push(b);wrap.append(b);});
    body.append(wrap);
    getAnswer=()=>st.sel==null?null:{ok:st.sel===ex.a,mis:st.sel!==ex.a&&ex.mis&&ex.mis[st.sel]?[ex.mis[st.sel]]:[]};
    mark=()=>els.forEach((e,j)=>{if(j===ex.a)e.classList.add('right');else if(j===st.sel)e.classList.add('wrong');});
    answerText=()=>ex.imgs[ex.a].l;
  }
  else if(ex.type==='imglabel'){
    const wrap=h('div',{class:'imgopts'});st.sels=[];
    ex.imgs.forEach((im,i)=>{const s=h('select',{id:'il'+Math.random().toString(36).slice(2),'aria-label':'Forma de relevo da imagem '+(i+1)},h('option',{value:''},'—'),ex.opts.map((o,oi)=>h('option',{value:oi},o)));st.sels.push(s);wrap.append(h('div',{class:'imgopt',style:'cursor:default'},imgTag(src(L,im.k),'Imagem '+(i+1)),s));});
    body.append(wrap);
    getAnswer=()=>{if(st.sels.some(s=>s.value===''))return null;return{ok:ex.imgs.every((im,i)=>+st.sels[i].value===im.a),mis:[]};};
    mark=()=>ex.imgs.forEach((im,i)=>{st.sels[i].classList.add(+st.sels[i].value===im.a?'right':'wrong');st.sels[i].disabled=true;});
    answerText=()=>ex.imgs.map((im,i)=>'Imagem '+(i+1)+': '+ex.opts[im.a]).join('; ');
  }
  else if(ex.type==='hotspot'){
    const crop=ex.crop||100;const inner=h('div',{class:'inner',style:'width:'+(10000/crop)+'%'});const im=imgTag(src(L,ex.k),'Mapa',{style:'width:100%'});inner.append(im);
    const hot=h('div',{class:'hot',role:'button',tabindex:'0','aria-label':'Mapa: clica para marcar'},inner);
    hot.addEventListener('click',e=>{if(st.locked)return;const r=inner.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*100,y=(e.clientY-r.top)/r.height*100;st.p={x,y};let pin=$('.pin',inner);if(!pin){pin=h('div',{class:'pin'});inner.append(pin);}pin.style.left=x+'%';pin.style.top=y+'%';});
    body.append(hot);
    const inside=p=>ex.zones.some(z=>p.x>=z.x&&p.x<=z.x+z.w&&p.y>=z.y&&p.y<=z.y+z.h);
    getAnswer=()=>st.p?{ok:inside(st.p),mis:[]}:null;
    mark=()=>{const pin=$('.pin',inner);if(pin&&inside(st.p))pin.classList.add('ok');else ex.zones.forEach(z=>inner.append(h('div',{class:'zone',style:`left:${z.x}%;top:${z.y}%;width:${z.w}%;height:${z.h}%`})));};
    answerText=()=>'a área assinalada a tracejado verde';
  }
  else if(ex.type==='text'||ex.type==='reflect'){
    const ta=h('textarea',{id:'ta'+Math.random().toString(36).slice(2),placeholder:'Escreve aqui a tua resposta…','aria-label':'Resposta'});body.append(ta);
    getAnswer=()=>{const v=ta.value.trim();if(!v)return null;if(ex.type==='reflect')return{ok:true,reflect:true,mis:[]};
      let n=0;if(ex.groups)n=ex.groups.filter(g=>g.some(k=>has(v,k))).length;if(ex.anyOf)n=ex.anyOf.filter(k=>has(v,k)).length;
      const bad=(ex.forbid||[]).some(k=>has(v,k));const ok=n>=ex.need&&!bad;return{ok,partial:Math.min(1,n/ex.need),forbidden:bad,mis:ok?[]:(ex.mis&&ex.mis.fail?[ex.mis.fail]:[])};};

      if(r.forbidden)f.append(h('div',{class:'mis'},'A tua resposta inclui uma ideia errada. Relê a explicação.'));

    if(opt.onDone)opt.onDone(r,c);
  };

}

function lvlStats(l){let tot=0,done=0,ok=0;PATH[l].modules.forEach(m=>m.ex.forEach((e,i)=>{if(e.type==='reflect')return;tot++;const r=S.path[l][m.id+'-'+i];if(r){done++;if(r.ok)ok++;}}));return{tot,done,ok};}
function viewPath(){
  if(needStudent()){const g=h('div',{class:'view'},h('h1',{},'A Península Ibérica: localização e quadro natural'),studentGate(viewPathRefresh));app.append(g);return;}

    h('div',{style:'display:grid;gap:12px'},h('span',{class:'mono',style:'color:var(--muted)'},'Ficha de Avaliação n.º 1 · Grupos I e II'),h('h1',{},'A Península Ibérica: localização e quadro natural'),
      h('p',{class:'lead'},'Sobe do Nível C ao Nível A como quem sobe de uma planície até à montanha. Em cada etapa lês a explicação, conheces as palavras-chave, vês exemplos e evitas os erros mais comuns. No fim de cada nível há uma recapitulação.')),
    h('div',{class:'card name'},h('label',{for:'aluno'},'Nome do aluno'),name,h('label',{for:'turma'},'Turma'),turma,h('p',{class:'legend-note'},'O progresso fica guardado neste navegador.'+(sendOn()?' No fim do teste, os resultados são enviados ao professor.':'')))));

function viewProf(){
  const v=h('div',{class:'prof'});
  v.innerHTML=`
  <div style="display:grid;gap:8px"><span class="mono" style="color:var(--muted)">Área do professor</span><h1>Análise especializada das questões</h1>
  <p class="lead">Avaliação das fichas de nível A, B e C (Grupos I e II) do ponto de vista científico e didático, com sugestões para usar esta aplicação em aula.</p></div>
  <section><h2>Conceitos pressupostos, mas não explicados</h2><ul class="clean">
   <li><b>Pontos cardeais e colaterais.</b> As questões de localização («a sudoeste») assumem que o aluno domina a rosa-dos-ventos e a regra de nomear primeiro Norte/Sul.</li>
   <li><b>Escala.</b> Pede-se a classificação «pequena/grande escala» sem que a ficha mobilize a noção de redução nem a relação inversa com o denominador da escala numérica. É o conceito com mais erros previsíveis.</li>
   <li><b>Os cinco elementos do mapa</b> (título, orientação, escala, legenda, fonte) são pedidos (nível A: «três dos cinco») mas nunca enumerados. O doc. 3 não tem legenda nem fonte visíveis, e o título está fora da imagem.</li>
   <li><b>Hemisfério.</b> A opção «central» funciona como distrator, mas a ficha não relaciona o Equador e Greenwich com os hemisférios.</li>
   <li><b>Clima vs. estado do tempo</b> e os <b>fatores do clima</b> (latitude, proximidade do mar, relevo). A associação clima–definição é memorística se o aluno não souber porque é que o litoral é ameno.</li>
   <li><b>Critério de rio luso-espanhol vs. nacional</b> (nascente/bacia em Espanha), necessário para responder sem decorar.</li>
   <li><b>Relação linhas ↔ zonas.</b> Os trópicos e os círculos polares (Grupo I) são os limites das zonas climáticas (Grupo II), mas a ficha não faz a ponte.</li></ul></section>
  <section><h2>Limitações e imprecisões dos itens</h2><ul class="clean">
   <li><b>«Regiões montanhosas, como as cordilheiras e as mesetas»</b> (G-II, 1.1, opção correta). Cientificamente, a meseta é um <b>planalto</b>, não uma região montanhosa. Sugere-se «regiões elevadas» ou «cordilheiras e planaltos». A aplicação assinala esta nuance na explicação.</li>
   <li><b>Definições climáticas só por temperatura.</b> A legenda do doc. 2 inclui a precipitação (chuva abundante / moderada / pouca), mas as definições do quadro omitem-na. O clima temperado marítimo fica reduzido a «temperaturas amenas», o que não o distingue do mediterrâneo no inverno.</li>
   <li><b>«Os quatro rios luso-espanhóis».</b> São os quatro <b>principais</b>. O Lima e o Tâmega também nascem na Galiza, e há rios de fronteira (Erges, Sever, Chança). Convém escrever «os quatro maiores».</li>
   <li><b>Rios nacionais «no Norte».</b> O enunciado diz «no Norte», mas a solução diz «mais a norte» (Cávado e Ave). Há outras respostas aceitáveis (Neiva, Leça). A correção automática aceita-as.</li>
   <li><b>Levadas como «cursos de água».</b> São obras humanas, não cursos de água naturais. É uma boa oportunidade para distinguir o natural do artificial e ligar ao Grupo III.</li>
   <li><b>Item 4.2 da versão B</b> («rio mais próximo da tua localidade») é de resposta individual e não avaliável de forma objetiva. Na aplicação foi convertido em reflexão, com o exemplo local do Tejo e do rio Coina (Barreiro).</li>
   <li><b>Versão C, 3.1 «Sublinha o título»</b>: o mapa não tem título dentro da imagem. Na aplicação passou a «escolhe o melhor título».</li>
   <li><b>Ibéria Húmida / Ibéria Seca</b> é uma divisão binária: ignora áreas de transição, o efeito da altitude (manchas de folha caduca nas serras do sul) e os arquipélagos.</li>
   <li><b>Fotografia aérea «captada por um drone»</b>: tradicionalmente é feita de avião. Convém não associar o conceito a um único meio.</li></ul></section>
  <section><h2>Contexto em falta e informação a atualizar</h2><ul class="clean">
   <li><b>Projeções cartográficas.</b> O planisfério aparece como «representação da totalidade da Terra» sem referência às deformações (Gronelândia vs. África). Hoje existem projeções de áreas iguais muito usadas em atlas.</li>
   <li><b>Tecnologias de informação geográfica.</b> GPS, Google Earth, SIG e imagens Copernicus/Sentinel são o modo atual de «representar a Terra» e motivam os alunos. A imagem de satélite deixou de ser exótica.</li>
   <li><b>Alterações climáticas.</b> As fronteiras entre climas e entre Ibéria Húmida e Seca não são fixas: a tendência para verões mais quentes, secas mais frequentes e risco de desertificação no sul é um contexto importante (relatórios do IPMA e da Agência Portuguesa do Ambiente).</li>
   <li><b>Ponto mais alto de Portugal.</b> A ficha centra-se na Península, mas os alunos devem saber que é o Pico (Açores, 2351 m), e a Serra da Estrela (1993 m) no continente.</li>
   <li><b>Escala local.</b> O Barreiro fica no estuário do Tejo, junto à foz do Coina: usar a paisagem local reforça os conceitos de rio, estuário, planície e clima mediterrâneo.</li></ul></section>
  <section><h2>Técnicas mais avançadas</h2><ul class="clean">
   <li>Escala numérica e cálculo de distâncias reais (régua + barra de escala).</li>
   <li>Coordenadas geográficas (latitude e longitude) para a localização absoluta.</li>
   <li>Leitura de gráficos termopluviométricos (climogramas) de Porto, Madrid e Faro para caracterizar os climas com dados.</li>
   <li>Perfis topográficos simples a partir do mapa hipsométrico (por exemplo, Lisboa–Madrid).</li>
   <li>Comparar imagens de satélite de datas diferentes (vegetação, incêndios, albufeiras).</li></ul></section>
  <section><h2>Equívocos mais comuns (e onde a aplicação os trabalha)</h2><ul class="clean">
   <li>Pequena escala = «coisas pequenas» → Laboratório «A escala».</li>
   <li>Frio nos polos por estarem «longe do Sol» → Laboratório «Linhas imaginárias e zonas climáticas».</li>
   <li>Meseta = planície → Laboratório «Planalto, planície ou montanha?».</li>
   <li>Cores do mapa hipsométrico lidas como vegetação → mesmo laboratório, passo 2.</li>
   <li>Clima = estado do tempo; esquecer o papel do mar → Laboratório «Clima e influência do mar».</li>
   <li>Trocar sudoeste/noroeste e caduca/persistente → laboratórios correspondentes.</li></ul>
   <p class="legend-note">O relatório do teste identifica estes equívocos quando se repetem (2 ou mais vezes) e gera um plano de revisão por conceito.</p></section>
  <section><h2>Próximos tópicos a estudar, por importância</h2><ol class="rank">
   <li><div><b>Escala numérica e gráfica.</b> Calcular distâncias reais e comparar escalas. É a base de toda a leitura cartográfica e a maior fonte de erro.</div></li>
   <li><div><b>Localização relativa e absoluta.</b> Rosa-dos-ventos, pontos colaterais e iniciação às coordenadas geográficas.</div></li>
   <li><div><b>Fatores do clima e climogramas.</b> Latitude, proximidade do mar e relevo, e leitura de gráficos termopluviométricos.</div></li>
   <li><div><b>Formas de relevo e mapa hipsométrico.</b> Montanha, planalto, planície e vale, e perfis topográficos simples.</div></li>
   <li><div><b>Rede hidrográfica.</b> Nascente, foz, afluente, bacia hidrográfica e estuário (Tejo e Barreiro como caso de estudo).</div></li>
   <li><div><b>Vegetação natural e adaptação ao clima.</b> Espécies das duas Ibérias, montado e cortiça.</div></li>
   <li><div><b>Ação humana sobre a paisagem</b> (Grupo III, não incluído nesta aplicação): aterros, dunas, incêndios, ordenamento do território.</div></li>
   <li><div><b>Projeções cartográficas e ferramentas digitais</b> (SIG, Google Earth, imagens de satélite).</div></li>
   <li><div><b>Ligação à História:</b> como o quadro natural (rios, litoral, relevo) influenciou a fixação dos primeiros povos na Península, o tema seguinte do programa.</div></li></ol></section>
  <section><h2>Sugestões de uso em aula</h2><ul class="clean">
   <li>Diferenciação: alunos com mais dificuldades começam no Nível C; os restantes podem saltar para o B após a recapitulação.</li>
   <li>O teste final é igual para todos e permite comparar o progresso. O relatório pode ser projetado ou mostrado ao aluno individualmente.</li>
   <li>Os dados ficam só no navegador de cada aluno. Para reiniciar um computador partilhado, use o botão abaixo.</li></ul>
   <div class="row" id="resetrow"></div></section>`;
  app.append(v);
  const rr=$('#resetrow');const out=h('span',{class:'legend-note'});
  const b=h('button',{class:'btn ghost small',type:'button'},'Apagar o progresso guardado neste navegador');
